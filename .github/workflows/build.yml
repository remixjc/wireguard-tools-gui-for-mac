name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package .app
        run: ./Scripts/build-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireGuardTray.app
          path: dist/WireGuardTray.app
